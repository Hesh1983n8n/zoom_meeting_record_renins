services:
  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3667:3667"
    volumes:
      - "E:/Docker_Prod/ReninsMeet/records:/records"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3667/api/v1/status"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: ./services/web
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
