version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: zoom-recorder-redis

  zoom-recorder-api:
    build: ./api
    container_name: zoom-recorder-api
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3667"]
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - QUEUE_NAME=${QUEUE_NAME}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME}
      - ZOOM_MEETING_SDK_KEY=${ZOOM_MEETING_SDK_KEY}
      - ZOOM_OAUTH_CLIENT_ID=${ZOOM_OAUTH_CLIENT_ID}
      - ZOOM_OAUTH_CLIENT_SECRET=${ZOOM_OAUTH_CLIENT_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - OAUTH_REDIRECT_PATH=${OAUTH_REDIRECT_PATH}
      - OAUTH_BASE_URL=${OAUTH_BASE_URL}
      - MEETAI_API_KEY=${MEETAI_API_KEY}
    ports:
      - "3667:3667"
    depends_on:
      - redis

  bot-worker:
    build: ./bot
    container_name: zoom-recorder-bot
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - QUEUE_NAME=${QUEUE_NAME}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME}
      - DATA_DIR=${DATA_DIR}
      - OAUTH_BASE_URL=${OAUTH_BASE_URL}
      - MEETAI_API_KEY=${MEETAI_API_KEY}
    volumes:
      - ./data:/data
    depends_on:
      - redis
