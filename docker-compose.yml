version: "3.9"

services:
  web:
    build: ./web
    ports:
      - "3667:3667"
    environment:
      - BOT_HTTP_URL=http://bot:8080
    depends_on:
      - bot
    volumes:
      - E:\Docker_Prod\ReninsMeet:/data

  bot:
    build: ./bot
    environment:
      - ZOOM_SDK_KEY=${ZOOM_SDK_KEY}
      - ZOOM_SDK_SECRET=${ZOOM_SDK_SECRET}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME:-Meet.Ai}
      - DATA_DIR=/data
      - RECORD_RETENTION_DAYS=5
      - ZOOM_RECORDER_BIN=/app/bin/zoom_bot_recorder
      - MERGE_BIN=/app/bin/merge_audio
    volumes:
      - E:\Docker_Prod\ReninsMeet:/data
