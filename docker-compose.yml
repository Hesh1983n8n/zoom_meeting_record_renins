services:
  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3667:3667"
    volumes:
      - "E:/Docker_Prod/ReninsMeet/records:/records"
  web:
    build:
      context: ./services/web
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - bot
    restart: unless-stopped
