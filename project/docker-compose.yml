version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: zoom-recorder-redis

  zoom-recorder-api:
    build: ./api
    container_name: zoom-recorder-api
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3667"]
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - QUEUE_NAME=${QUEUE_NAME}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME}
      - ZOOM_MEETING_SDK_KEY=${ZOOM_MEETING_SDK_KEY}
      - ZOOM_MEETING_SDK_SECRET=${ZOOM_MEETING_SDK_SECRET}
      - ZOOM_OAUTH_CLIENT_ID=${ZOOM_OAUTH_CLIENT_ID}
      - ZOOM_OAUTH_CLIENT_SECRET=${ZOOM_OAUTH_CLIENT_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - OAUTH_REDIRECT_PATH=${OAUTH_REDIRECT_PATH}
    ports:
      - "3667:3667"
    depends_on:
      - redis

  bot-worker:
    build: ./bot
    container_name: zoom-recorder-bot
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - QUEUE_NAME=${QUEUE_NAME}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME}
      - DATA_DIR=${DATA_DIR}
    volumes:
      - ./data:/data
    depends_on:
      - redis

  ngrok:
    image: ngrok/ngrok:latest
    container_name: zoom-recorder-ngrok
    depends_on:
      - zoom-recorder-api
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN}
    command:
      - http
      - --domain=${NGROK_DOMAIN}
      - zoom-recorder-api:3667
    ports:
      - "4040:4040"
